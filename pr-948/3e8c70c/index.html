<main><h1>#948 界面预览</h1><p class="m">commit 3e8c70c · <a href="https://github.com/yetone/magpie/pull/948">回到 PR</a> · 请求页（用量 › 请求）在汇总下面新增一排可点击的来源方块：「全部请求 / 经过 magpie / 不经过 magpie」，点击即按来源筛选并带 aria-pressed，URL 支持 ?via=；来自会话文件的行在「供应商·账号」列会显示文件里记下的供应商 id（有账号时账号优先），对应角标的提示也区分「文件记的供应商」与「只认得出账号」。</p>
